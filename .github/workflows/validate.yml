name: Validate

# A broken manifest.json is fatal — Home Assistant refuses to load the
# integration at all, and every entity disappears on the next restart. v1.3.0
# shipped with an EMPTY manifest because a version-bump one-liner truncated the
# file before reading it, and nothing between that edit and the published
# release looked at the result. This job looks at the result.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Every JSON file parses and is non-empty
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              raw = p.read_text(encoding='utf-8')
              if not raw.strip():
                  bad.append(f'{p}: EMPTY')
                  continue
              try:
                  json.loads(raw)
              except Exception as e:
                  bad.append(f'{p}: {e}')
          print('\n'.join(bad) or 'all JSON ok')
          sys.exit(1 if bad else 0)
          EOF

      - name: manifest.json has the keys Home Assistant requires
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open('custom_components/teams_randomiser/manifest.json', encoding='utf-8'))
          # version is required for CUSTOM integrations specifically; HA core
          # integrations omit it, so it is easy to drop and not notice.
          required = ['domain', 'name', 'version', 'documentation', 'codeowners',
                      'iot_class', 'config_flow']
          missing = [k for k in required if not m.get(k)]
          if missing:
              sys.exit('manifest.json missing: ' + ', '.join(missing))
          print('manifest ok, version', m['version'])
          EOF

      - name: Every module compiles
        run: python -m compileall -q custom_components/

      - name: Release tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import json, os, sys
          tag = os.environ['GITHUB_REF'].removeprefix('refs/tags/v')
          ver = json.load(open('custom_components/teams_randomiser/manifest.json',
                               encoding='utf-8'))['version']
          # HACS installs by tag but Home Assistant reports the manifest version,
          # so a mismatch shows the wrong version forever with no way to tell.
          if tag != ver:
              sys.exit(f'tag v{tag} != manifest version {ver}')
          print(f'tag and manifest agree on {ver}')
          EOF
